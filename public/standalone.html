<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Expense Tracker - Main HTML Web App</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- React 18 & ReactDOM UMD CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons UMD CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase Compat JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- jsPDF & AutoTable CDN for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.6);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <div id="root">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="font-bold text-slate-500 text-sm">Loading Main HTML Web App...</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ----------------------------------------------------
    // FIREBASE INITIALIZATION & FALLBACK ENGINE
    // ----------------------------------------------------
    const firebaseConfig = {
      projectId: "gen-lang-client-0608991347",
      appId: "1:300318891274:web:7b1d049b82c90e737f6ef3",
      apiKey: "AIzaSyDH8VF8F38I-5NDMNOz0PHoUwaCFqs6WgY",
      authDomain: "gen-lang-client-0608991347.firebaseapp.com",
      storageBucket: "gen-lang-client-0608991347.firebasestorage.app",
      messagingSenderId: "300318891274"
    };

    let db = null;
    let isFirebaseReady = false;

    try {
      if (window.firebase && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        if (db && db.namedQuery) {
          // Specify database ID if supported
        }
        isFirebaseReady = true;
      }
    } catch (e) {
      console.warn("Firebase initialized in fallback mode or offline mode:", e);
    }

    // ----------------------------------------------------
    // CONSTANTS & TYPES
    // ----------------------------------------------------
    const FAMILY_MEMBERS = ['Amir Khan', 'Subhani', 'Kajal', 'Shahnaz', 'Sonam'];
    const ADMIN_MEMBER = 'Amir Khan';

    const CATEGORIES = [
      { id: 'Groceries', label: 'Groceries & Food', icon: 'shopping-bag', color: 'bg-emerald-500' },
      { id: 'Utilities', label: 'Utilities & Bills', icon: 'zap', color: 'bg-amber-500' },
      { id: 'Rent', label: 'Rent & Housing', icon: 'home', color: 'bg-indigo-500' },
      { id: 'Medical', label: 'Medical & Healthcare', icon: 'heart-pulse', color: 'bg-rose-500' },
      { id: 'Education', label: 'Education & Fees', icon: 'book-open', color: 'bg-blue-500' },
      { id: 'Fuel', label: 'Fuel & Transport', icon: 'car', color: 'bg-orange-500' },
      { id: 'Shopping', label: 'Shopping & Clothes', icon: 'shopping-cart', color: 'bg-purple-500' },
      { id: 'Dining', label: 'Dining & Restaurants', icon: 'utensils', color: 'bg-pink-500' },
      { id: 'Entertainment', label: 'Entertainment & Outings', icon: 'tv', color: 'bg-cyan-500' },
      { id: 'EMI', label: 'EMI & Loans', icon: 'credit-card', color: 'bg-red-500' },
      { id: 'Household', label: 'Household Maintenance', icon: 'wrench', color: 'bg-slate-500' },
      { id: 'Others', label: 'Others / Misc', icon: 'more-horizontal', color: 'bg-gray-500' },
    ];

    const formatINR = (amt) => {
      const num = Number(amt) || 0;
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);
    };

    // ----------------------------------------------------
    // MAIN APP COMPONENT
    // ----------------------------------------------------
    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('fet_theme') || 'light');
      const [activeMember, setActiveMember] = useState(() => localStorage.getItem('fet_activeMember') || ADMIN_MEMBER);
      const [selectedMonth, setSelectedMonth] = useState(() => new Date().toISOString().substring(0, 7));
      const [monthlyBudget, setMonthlyBudget] = useState(() => Number(localStorage.getItem('fet_budget')) || 50000);

      const [expenses, setExpenses] = useState([]);
      const [memberBankAmounts, setMemberBankAmounts] = useState({});
      const [emis, setEmis] = useState([]);
      const [adminPin, setAdminPin] = useState('1234');

      // Modals State
      const [isAddExpenseOpen, setIsAddExpenseOpen] = useState(false);
      const [editingExpense, setEditingExpense] = useState(null);
      const [isAdminPinModalOpen, setIsAdminPinModalOpen] = useState(false);
      const [isExportImportModalOpen, setIsExportImportModalOpen] = useState(false);
      const [viewTab, setViewTab] = useState('dashboard'); // 'dashboard', 'emi', 'history'

      // Apply theme class
      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('fet_theme', theme);
      }, [theme]);

      useEffect(() => {
        localStorage.setItem('fet_activeMember', activeMember);
      }, [activeMember]);

      // Realtime listener or LocalStorage fallback
      useEffect(() => {
        if (isFirebaseReady && db) {
          // Firestore listener
          const unsubExpenses = db.collection('expenses').onSnapshot(snap => {
            const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setExpenses(list);
          }, err => console.warn('Firestore error:', err));

          const unsubBank = db.collection('memberBankAmounts').onSnapshot(snap => {
            const map = {};
            snap.docs.forEach(doc => { map[doc.id] = doc.data(); });
            setMemberBankAmounts(map);
          }, err => console.warn('Firestore bank error:', err));

          const unsubPin = db.collection('adminSettings').doc('pin').onSnapshot(doc => {
            if (doc.exists && doc.data().pin) {
              setAdminPin(doc.data().pin);
            }
          });

          return () => {
            unsubExpenses();
            unsubBank();
            unsubPin();
          };
        } else {
          // LocalStorage Fallback
          const savedExp = localStorage.getItem('fet_expenses');
          if (savedExp) setExpenses(JSON.parse(savedExp));
          
          const savedBank = localStorage.getItem('fet_bank');
          if (savedBank) setMemberBankAmounts(JSON.parse(savedBank));
        }
      }, []);

      // Calculate Monthly Totals
      const monthExpenses = useMemo(() => {
        return expenses.filter(e => e.date && e.date.startsWith(selectedMonth));
      }, [expenses, selectedMonth]);

      const memberTotals = useMemo(() => {
        const totals = {};
        FAMILY_MEMBERS.forEach(m => { totals[m] = 0; });
        monthExpenses.forEach(exp => {
          if (totals[exp.paidBy] !== undefined) {
            totals[exp.paidBy] += Number(exp.amount) || 0;
          }
        });
        // Apply month spent override if present
        FAMILY_MEMBERS.forEach(m => {
          const override = memberBankAmounts[m]?.customMonthSpentOverride;
          if (override !== undefined && override !== null && !isNaN(Number(override))) {
            totals[m] = Number(override);
          }
        });
        return totals;
      }, [monthExpenses, memberBankAmounts]);

      const totalSpentMonth = useMemo(() => {
        return Object.values(memberTotals).reduce((a, b) => a + b, 0);
      }, [memberTotals]);

      // Add / Edit Expense Handler
      const handleSaveExpense = async (expenseData) => {
        if (isFirebaseReady && db) {
          if (editingExpense?.id) {
            await db.collection('expenses').doc(editingExpense.id).update(expenseData);
          } else {
            await db.collection('expenses').add({ ...expenseData, createdAt: new Date().toISOString() });
          }
        } else {
          let updated = [...expenses];
          if (editingExpense?.id) {
            updated = updated.map(e => e.id === editingExpense.id ? { ...e, ...expenseData } : e);
          } else {
            updated.push({ id: 'loc_' + Date.now(), ...expenseData, createdAt: new Date().toISOString() });
          }
          setExpenses(updated);
          localStorage.setItem('fet_expenses', JSON.stringify(updated));
        }
        setIsAddExpenseOpen(false);
        setEditingExpense(null);
      };

      // Delete Expense Handler
      const handleDeleteExpense = async (id) => {
        if (!confirm("Are you sure you want to delete this expense entry?")) return;
        if (isFirebaseReady && db) {
          await db.collection('expenses').doc(id).delete();
        } else {
          const updated = expenses.filter(e => e.id !== id);
          setExpenses(updated);
          localStorage.setItem('fet_expenses', JSON.stringify(updated));
        }
      };

      // Update Bank Amount Handler
      const handleUpdateBankAmount = async (member, payload) => {
        if (isFirebaseReady && db) {
          await db.collection('memberBankAmounts').doc(member).set(payload, { merge: true });
        } else {
          const updated = {
            ...memberBankAmounts,
            [member]: { ...(memberBankAmounts[member] || {}), ...payload }
          };
          setMemberBankAmounts(updated);
          localStorage.setItem('fet_bank', JSON.stringify(updated));
        }
      };

      return (
        <div className="min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
          
          {/* HEADER BAR */}
          <header className="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 shadow-xs">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-3 flex-wrap">
              
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 text-white flex items-center justify-center font-black text-xl shadow-md shadow-indigo-500/20">
                  ₹
                </div>
                <div>
                  <h1 className="font-black text-lg sm:text-xl tracking-tight leading-tight">Family Expense Tracker</h1>
                  <p className="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>Standalone Web App Ready</span>
                  </p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl text-xs font-black">
                <button
                  onClick={() => setViewTab('dashboard')}
                  className={`px-3.5 py-2 rounded-xl transition-all cursor-pointer ${viewTab === 'dashboard' ? 'bg-white dark:bg-slate-700 shadow-xs text-indigo-600 dark:text-indigo-300' : 'text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'}`}
                >
                  Dashboard
                </button>
                <button
                  onClick={() => setViewTab('history')}
                  className={`px-3.5 py-2 rounded-xl transition-all cursor-pointer ${viewTab === 'history' ? 'bg-white dark:bg-slate-700 shadow-xs text-indigo-600 dark:text-indigo-300' : 'text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'}`}
                >
                  Transactions ({expenses.length})
                </button>
              </div>

              {/* Action Buttons */}
              <div className="flex items-center gap-2">
                
                {/* Active Profile Dropdown */}
                <select
                  value={activeMember}
                  onChange={(e) => setActiveMember(e.target.value)}
                  className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none"
                >
                  {FAMILY_MEMBERS.map(m => (
                    <option key={m} value={m}>{m} {m === ADMIN_MEMBER ? '(Admin)' : ''}</option>
                  ))}
                </select>

                {/* Add Expense Button */}
                <button
                  onClick={() => { setEditingExpense(null); setIsAddExpenseOpen(true); }}
                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs rounded-xl shadow-md shadow-indigo-600/20 flex items-center gap-1.5 cursor-pointer active:scale-95 transition-all"
                >
                  <span>+ Add Expense</span>
                </button>

                {/* Theme Toggle */}
                <button
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 cursor-pointer"
                  title="Toggle Theme"
                >
                  {theme === 'dark' ? '☀️' : '🌙'}
                </button>
              </div>

            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

            {/* TOP STATS BANNER */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              
              <div className="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-sm">
                <p className="text-xs font-black uppercase text-slate-400">Total Spent ({selectedMonth})</p>
                <p className="text-3xl font-black font-mono text-red-600 dark:text-red-400 mt-1">{formatINR(totalSpentMonth)}</p>
                <div className="mt-2 text-[11px] font-bold text-slate-400">
                  Monthly Budget: {formatINR(monthlyBudget)}
                </div>
              </div>

              <div className="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-sm">
                <p className="text-xs font-black uppercase text-slate-400">Budget Remaining</p>
                <p className={`text-3xl font-black font-mono mt-1 ${monthlyBudget - totalSpentMonth >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600'}`}>
                  {formatINR(monthlyBudget - totalSpentMonth)}
                </p>
                <div className="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full mt-3 overflow-hidden">
                  <div
                    className="bg-indigo-600 h-full rounded-full transition-all"
                    style={{ width: `${Math.min(100, Math.round((totalSpentMonth / (monthlyBudget || 1)) * 100))}%` }}
                  ></div>
                </div>
              </div>

              <div className="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-sm flex flex-col justify-between">
                <div>
                  <p className="text-xs font-black uppercase text-slate-400">Active Month Filter</p>
                  <input
                    type="month"
                    value={selectedMonth}
                    onChange={(e) => setSelectedMonth(e.target.value)}
                    className="mt-1 px-3 py-1.5 rounded-xl font-mono text-sm font-black bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 w-full"
                  />
                </div>
                <p className="text-[11px] text-slate-400 font-bold mt-2">
                  Showing {monthExpenses.length} transactions for {selectedMonth}
                </p>
              </div>

            </div>

            {/* FAMILY MEMBERS CARDS GRID */}
            <div>
              <h2 className="text-sm font-black uppercase tracking-wider text-slate-400 mb-3">Family Members Monthly Spending</h2>
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                {FAMILY_MEMBERS.map(m => {
                  const spent = memberTotals[m] || 0;
                  const bankData = memberBankAmounts[m] || {};
                  return (
                    <div key={m} className="p-4 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-xs space-y-1">
                      <div className="flex items-center justify-between">
                        <span className="font-extrabold text-xs truncate text-slate-700 dark:text-slate-200">{m}</span>
                        {m === activeMember && <span className="w-2 h-2 rounded-full bg-indigo-500"></span>}
                      </div>
                      <p className="text-xl font-black font-mono text-red-600 dark:text-red-400">{formatINR(spent)}</p>
                      {bankData.pendingBankAmount > 0 && (
                        <p className="text-[10px] font-bold text-amber-600 dark:text-amber-400">
                          Pending Dues: {formatINR(bankData.pendingBankAmount)}
                        </p>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* TRANSACTIONS TABLE */}
            <div className="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-sm space-y-4">
              <div className="flex items-center justify-between">
                <h2 className="font-black text-base">Expense Log ({monthExpenses.length})</h2>
                <button
                  onClick={() => { setEditingExpense(null); setIsAddExpenseOpen(true); }}
                  className="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 font-bold text-xs rounded-xl hover:bg-indigo-100 cursor-pointer"
                >
                  + New Expense
                </button>
              </div>

              {monthExpenses.length === 0 ? (
                <div className="p-8 text-center text-slate-400 font-bold text-sm">
                  No expense records found for {selectedMonth}. Click "+ New Expense" to add one!
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-slate-100 dark:border-slate-800 text-slate-400 font-black uppercase">
                        <th className="p-3">Date</th>
                        <th className="p-3">Paid By</th>
                        <th className="p-3">Category</th>
                        <th className="p-3">Notes</th>
                        <th className="p-3 text-right">Amount</th>
                        <th className="p-3 text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                      {monthExpenses.map(exp => (
                        <tr key={exp.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                          <td className="p-3 font-mono font-bold text-slate-500">{exp.date}</td>
                          <td className="p-3 font-extrabold text-slate-800 dark:text-slate-200">{exp.paidBy}</td>
                          <td className="p-3">
                            <span className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-[11px]">
                              {exp.category}
                            </span>
                          </td>
                          <td className="p-3 text-slate-500 max-w-xs truncate">{exp.notes || '-'}</td>
                          <td className="p-3 text-right font-black font-mono text-red-600 dark:text-red-400 text-sm">
                            {formatINR(exp.amount)}
                          </td>
                          <td className="p-3 text-center">
                            <button
                              onClick={() => handleDeleteExpense(exp.id)}
                              className="text-rose-500 hover:text-rose-700 font-bold text-xs p-1 cursor-pointer"
                            >
                              Delete
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

          </main>

          {/* ADD EXPENSE MODAL */}
          {isAddExpenseOpen && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border border-slate-100 dark:border-slate-800 text-slate-900 dark:text-white space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="font-black text-base">Add New Expense</h3>
                  <button onClick={() => setIsAddExpenseOpen(false)} className="p-1 text-slate-400 font-bold text-lg">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const formData = new FormData(e.target);
                  handleSaveExpense({
                    amount: parseFloat(formData.get('amount')) || 0,
                    paidBy: formData.get('paidBy'),
                    category: formData.get('category'),
                    date: formData.get('date'),
                    notes: formData.get('notes'),
                  });
                }} className="space-y-3 text-xs">
                  
                  <div>
                    <label className="block font-black text-slate-400 mb-1">Amount (₹)</label>
                    <input
                      name="amount"
                      type="number"
                      step="any"
                      required
                      placeholder="e.g. 1500"
                      className="w-full px-3.5 py-2.5 rounded-2xl font-mono font-black text-sm border bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700"
                    />
                  </div>

                  <div>
                    <label className="block font-black text-slate-400 mb-1">Paid By</label>
                    <select
                      name="paidBy"
                      defaultValue={activeMember}
                      className="w-full px-3.5 py-2.5 rounded-2xl font-bold border bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700"
                    >
                      {FAMILY_MEMBERS.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block font-black text-slate-400 mb-1">Category</label>
                    <select
                      name="category"
                      defaultValue="Groceries"
                      className="w-full px-3.5 py-2.5 rounded-2xl font-bold border bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700"
                    >
                      {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block font-black text-slate-400 mb-1">Date</label>
                    <input
                      name="date"
                      type="date"
                      defaultValue={new Date().toISOString().substring(0, 10)}
                      required
                      className="w-full px-3.5 py-2.5 rounded-2xl font-mono font-bold border bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700"
                    />
                  </div>

                  <div>
                    <label className="block font-black text-slate-400 mb-1">Notes / Item Details</label>
                    <input
                      name="notes"
                      type="text"
                      placeholder="e.g. Vegetables, Milk & Snacks"
                      className="w-full px-3.5 py-2.5 rounded-2xl font-bold border bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700"
                    />
                  </div>

                  <div className="pt-3 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsAddExpenseOpen(false)}
                      className="px-4 py-2.5 bg-slate-200 dark:bg-slate-800 font-extrabold rounded-2xl cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow-md cursor-pointer"
                    >
                      Save Expense Entry
                    </button>
                  </div>

                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
